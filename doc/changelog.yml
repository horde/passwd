  license:
    identifier: GPL-2.0
    uri: http://www.horde.org/licenses/gpl
  notes: "Original version string was 4.0.0alpha1\nFirst alpha release for Horde 4.\n[jan] Add Latvian translation (Jānis Eisaks <jancs@dv.lv>).\n[rla] Added new driver 'horde' which uses the update() function of horde's authentication driver.\n[jan] Provide default configuration files instead of .dist versions.\n[jan] Fix creating temporary files with open_basedir restrictions.\n"
3.1.3:
  notes: "[jan] Fix examples using 'minSymbols' instead of 'minSymbol' (Bug #8854).\n[jan] Fix PHP error when changing passwords with LDAP driver (Bug #8686).\n"
3.1.2:
  notes: "[jan] Enable output compression (horde@albasoft.com, Bug #8649).\n[jan] Add Croatian translation (Valentin Vidic <valentin.vidic@carnet.hr>).\n[jan] Add option to configure referrals for LDAP driver (manilal@ejyothi.com, Request #8582).\n[jan] Simplify and fix smbldap driver (Bug #8192).\n"
3.1.1:
  notes: "[cjh] SECURITY: Fix XSS when specifying an invalid backend key (security@davidwharton.us, #8398).\n[jan] Add hook that's called after successfully changing the password.\n[jan] Add SOAP driver.\n[jan] Add example configuration for Postfix Admin (Michael Brennen <michael@fishnet.us>).\n[jan] Fix binding to LDAP server if using the userdn hook.\n"
3.1.0:
  notes: "Original version string was 3.1\n[cjh] Fix bad mode for STDERR in the procopen driver (info@opensolutions.net, Bug #8022).\n"
3.1.0-RC2:
  notes: "Original version string was 3.1-RC2\n[cjh] Don't include the old password in LDAP driver error messages (Joffrey van Wageningen <joffrey-horde@coolhaven.info>).\n"
3.1.0-RC1:
  notes: "Original version string was 3.1-RC1\n[cjh] Add missing enforcement of minSymbol password policy (yann@pleiades.fr.eu.org, Bug #7260).\n[cjh] Only update smbldap attributes for Samba users, and update all attributes at once instead of one at a time (marco@csita.unige.it, Request #5977).\n[cjh] Don't set smbldap attributes that are commented out in the config (fabio.pedretti@ing.unibs.it, Request #5937).\n[jan] Move all Passwd-specific hook examples from Horde's config/ directory.\n[cjh] Add support for switching between encryption schemes (ulrich-horde@topfen.net, Request #2865).\n[jan] Add support for sudo to the example expect script (Dennis Voetelink <voetelink@ecn.nl>, Request #5300).\n[mas] Conform to WCAG 1.0 Priority 2/Section 508 accessibility guidelines. (Request #4080)\n[jan] Add new expect driver that uses the expect PECL PHP extension (Duck <duck@obala.net>).\n[mjr] Add new http driver for changing passwords via an existing web form.\n[mjr] Pass reference to driver to the _passwd_hook_username call.\n[jan] Add Turkish translation (METU <horde-tr@metu.edu.tr>).\n"
3.0.1:
  notes: "[jan] Add placeholders for domain and username parts to SQL driver queries (Vilius Sumskas <vilius@lnk.lt>, Request #4985).\n[jan] Improve error checking in poppassd driver (Bug #4505, horde@koornneef.net).\n[jan] Add Slovenian translation (Duck <duck@obala.net>).\n[jan] Compare hashing algorithms in passwords case insensitively (andreas@altroot.de, Bug #2708).\n[jan] Allow password changing for special Kolab users (mzizka@hotmail.com, Request #4128).\n[jan] Add Japanese translation (Hiromi Kimura <hiromi@tac.tsukuba.ac.jp>).\n[ben] Better support for MS-SQL\n[cjh] Add support in the expect driver for rssh, scponly, and other programs that can execute certain commands over ssh without providing a prompt (Request #2887).\n"
3.0.0:
  notes: "Original version string was 3.0\n[jan] Add configuration option to switch between using user names with and without realms.\n[jan] Add Slovak translation (Ivan Noris <vix@vazka.sk>).\n"
3.0.0-RC1:
  notes: "Original version string was 3.0-RC1\n[jan] Extend the expect script to allow setups with passwd as the login shell (Request #2550, Lionel Elie Mamane <lmamane@debian.org>).\n[jan] Don't bind to LDAP anonymously if binding with userdn fails (Bug #2502).\n[cjh] Fix updating shadowlastchange attribute in ldap driver (Roel Gloudemans <roel@gloudemans.info>).\n[jan] Extend the smbldap driver from the ldap driver to support all parameters of the ldap driver (Request #2499).\n"
3.0.0-BETA1:
  notes: "Original version string was 3.0-BETA\n[cjh] Use Crypt_CHAP to generate smbldap passwords (Bug #1223).\n[stb] Add Kolab driver.\n[cjh] Allow using admin credentials in the LDAP driver (Bug #1409).\n[cjh] Use bind variables in SQL drivers (selsky@columbia.edu, Bug #1718).\n[cjh] Allow the list of refused usernames to be empty (Bug #1544).\n[cjh] If $conf['user']['change'] is false, don't trust form input for the userid.\n[jan] Add Catalan translation (Joan Jorba Calsina <joan.jorba@rusc.net>).\n[cjh] Add ADSI and PSPASSWD windows password drivers (LRM <lrm@ionline.com.br>).\n[jan] Add Persian (Western) translation (Vahid Ghafarpour <vahid@ghafarpour.com>).\n[jan] Add shadowLastChange and shadowMin configuration items to LDAP driver (Roel Gloudemans <roel@gloudemans.info>).\n[cjh] Add proc_open() driver (Samuel Nicolary <sam@nicolary.org>).\n[cjh] Add an SMB LDAP driver (Shane Boulter <sboulter@ariasolutions.com>).\n[cjh] Add SSL support to the LDAP driver (LRM <lrm@ionline.com.br>).\n[max] Add minSymbols and minClasses password policies.  See comments in config/backends.php.dist for more information.\n[max] Add optional 'required' parameters to composite driver's subdriver configurations.\n[max] Add optional parameter 'no_reset' to the backend configs which prevents reseting the authenticated user's credentials on password changes.\n[max] Properly reset authenticated user's credentials.\n[cjh] Use password encryption that's now implemented in the Auth:: package.\n[max] Add pine driver which changes a pine-encoded file using FTP.\n[max] Fix password checking when encryption requires a random salt.\n[max] Add composite driver which will replace all the groups stuff.\n[max] Add support for backend groups to allow syncing of multiple backends.\n[max] Add query_lookup and query_modify parameters to the sql driver.\n[ejr] Add tls support for ldap driver.\n[ejr] Fix error reporting in poppassd driver.\n[ejr] Add binddn hook submitted by Amith Varghese <amith@xalan.com>.\n[ejr] make sure oldpassword == horde_login_password before changing horde cached password.\n[ejr] Fix md5 (md5-hex and md5-base64) encryption for ldap/sql (Amith Varghese <amith@xalan.com>).\n[mc]  Move templates to horde style directory layout, getName() -> getParam().\n[ejr] Implemented new CVS HEAD themes.\n[ejr] Updated to new CVS HEAD notification system.\n"
2.2.2:
  notes: "[jan] Close XSS when setting the parent frame's page title by javascript (cjh).\n[ejr] Configuration item for showing/changing username in the form.\n[jan] Allow to set the protocol version in the LDAP driver (ben@alkaloid.net).\n[cjh] Add crypt-blowfish and crypt-md5 encryption types. Also add crypt-des for completion which is just an alias for crypt (max).\n[jan] Add Estonian translation (Toomas Aas <toomas.aas@raad.tartu.ee>).\n"
2.2.1:
  notes: "[jan] Bug #40: Fix smbpasswd driver with non-bash shells (Christopher Huyler <chris@huyler.net>).\n[jan] Add Simplified Chinese translation (Zhang Bo <boozhang@sdb.ac.cn>).\n"
2.2.1-RC1:
  notes: "[jan] Add Indonesian language (Slamin <slamin@unej.ac.id>).\n[jan] Add Galician translation (Rafael Varela Pet <srrafa@usc.es>, Guillermo Mendez <guille@usc.es>).\n[jan] Add Danish translation (Anders Bruun Olsen <anders@bruun-olsen.net>).\n[jan] Add Arabic (Syria) translation (Platinum Development Team <devteam@platinum-sy.net>).\n[jan] Add Hungarian translation (Szabo Gyula <gyufi@sztaki.hu>).\n[jan] Add Romanian translation (Eugen Hoanca <eugenh@urban-grafx.ro>, Marius Dragulescu <mariusd@urban-grafx.ro>).\n[jan] Add Lithuanian translation (Vilius Sumskas <vilius@lnk.lt>).\n[ejr] Fix BC breaks in vpopmail and sql drivers.\n"
2.2.0:
  notes: "Original version string was 2.2\n[ejr] Allow bc for php versions that don't have the ctype extension.\n"
2.2.0-RC2:
  notes: "Original version string was 2.2-RC2\n[ejr] Fix missing path for expect binary.\n[ejr] Add missing scripts/ directory and missing expect script.\n[ejr] Fix error reporting in expect driver (j.huinink@wanadoo.nl).\n[ejr] Remove old realm code that was previously missed.\n[ejr] Port servuftp driver to new backends.conf format.\n[ejr] Return actual error message text in poppassd driver (submitted by Leena Heino <Leena.Heino@uta.fi>).\n[ejr] Change is_a(*, 'PEAR_Error') calls to PEAR::isError() calls for php bc.\n"
2.2.0-RC1:
  notes: "Original version string was 2.2-RC1\n[ejr] Add vpopmail driver (Anton Nekhoroshikh <anton@valuehost.ru>).\n[mac] Add vmailmgr driver (Marco Kaiser <bate@php.net>).\n[ejr] Add expect script (Gaudenz Steinlin).\n[ejr] Change ldap code to do self-password changes, add phpdoc.\n[ejr] Update ldap driver (Tjeerd van der Zee).\n[ejr] Reset Horde/IMP cached credentials when changing password.\n[ejr] Add username hooks (mac).\n[ejr] Rewrite driver system, add backends.conf system (mc).\n[jan] Add Italian translation (Fichera Gianrico <gianrico.fichera@itesys.it>).\n[cjh] Close several small XSS vulnerabilities (Mitja Kolsek <mitja.kolsek@acros.si>).\n"
2.1.0:
  notes: "Original version string was 2.1\n[ejr] Add servuftp interface.\n[ejr] Add exim sql backend.\n[ejr] Add smbpasswd support.\n[ejr] Move to driver driven system.\n[mc]  Add javascript checks for form input.\n[jan] Add Bulgarian translation (Miroslav Pendev <pendev@hotmail.com>).\n"
2.0.0:
  notes: "Original version string was 2.0\n[ejr] Added optional checks for password lengths and strength testing.\n[ejr] Remove check for prefs.php in notconfigured.inc.\n[ejr] Change from short-tag <?= to long format <?php echo.\n[ejr] Fix spacing and look of Submit button.\n[ejr] Update contact info in doc/INSTALL for mailing list.\n[ejr] Added Norwegian (nn_NO) translation.\n[ejr] Added Swedish (sv_SE) translation.\n"
